<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Presentation Design | Menna Hassan</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f8f8f6;
            color: #171717;
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }

        /* HEADER */

        header {
            padding: 25px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .back-link {
            color: #171717;
            text-decoration: none;
            font-size: 14px;
            border-bottom: 1px solid #171717;
            padding-bottom: 3px;
        }

        /* HERO */

        .hero {
            padding: 100px 7% 70px;
        }

        .section-label {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #666;
            margin-bottom: 15px;
        }

        .hero h1 {
            font-size: clamp(40px, 7vw, 80px);
            line-height: 1;
            margin-bottom: 25px;
            font-weight: 700;
        }

        .hero p {
            max-width: 650px;
            font-size: 17px;
            color: #666;
        }

        /* PROJECT */

        .project-section {
            padding: 70px 7%;
            border-top: 1px solid #ddd;
        }

        .project-title {
            font-size: 32px;
            margin-bottom: 35px;
        }

        /* PDF */

        .presentation-container {
            width: 100%;
            background: white;
            padding: 20px;
        }

        .presentation-pdf {
            width: 100%;
            height: 800px;
            border: none;
            display: block;
        }

        /* FOOTER */

        footer {
            border-top: 1px solid #ddd;
            padding: 40px 7%;
            margin-top: 30px;
            font-size: 13px;
            color: #666;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        /* RESPONSIVE */

        @media (max-width: 700px) {

            .hero {
                padding: 70px 5% 50px;
            }

            .project-section {
                padding: 60px 5%;
            }

            .presentation-container {
                padding: 10px;
            }

            .presentation-pdf {
                height: 600px;
            }

            footer {
                padding: 30px 5%;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
            MH.
        </div>

        <a href="index.html" class="back-link">
            ← Back to Portfolio
        </a>

    </header>


    <!-- HERO -->

    <section class="hero">

        <div class="section-label">
            Selected Work
        </div>

        <h1>
            Presentation<br>
            Design
        </h1>

        <p>
            A presentation design project focused on creating
            clear, engaging, and visually organized slides.
        </p>

    </section>


    <!-- PRESENTATION -->

    <section class="project-section">

        <div class="section-label">
            Presentation Project
        </div>

        <h2 class="project-title">
            حرف الطاء
        </h2>

        <div class="presentation-container">

            <embed
                src="حرف الطاء.pdf"
                type="application/pdf"
                class="presentation-pdf"
            >

        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <div>
            © 2026 Menna Hassan
        </div>

        <div>
            Presentation Design
        </div>

    </footer>

</body>
</html>
